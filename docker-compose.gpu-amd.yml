# AMD-Grafikkarte (ROCm) für die Qwen-Stimmen – Ergänzung zu docker-compose.yml.
#
#   docker compose -f docker-compose.yml -f docker-compose.gpu-amd.yml up -d --build
#
# Torch kommt als ROCm-Wheel (bringt die ROCm-Laufzeit selbst mit); auf dem
# Rechner selbst genügt der normale amdgpu-Treiber. Die App erkennt die Karte
# automatisch (QWEN_DEVICE=auto) und rechnet Qwen dann auf der GPU; Kokoro
# bleibt auf der CPU, da es dort ohnehin schneller als Echtzeit ist.
# RX 9070 / 9070 XT (RDNA4) brauchen ROCm 7.2 oder neuer.
#
# Kein Autostart: Die GPU teilt sich den Grafikspeicher mit anderen Programmen
# (z. B. ComfyUI). Qwen 1.7B belegt ~4–5 GB, solange der Container läuft.
# Starten/Stoppen bei Bedarf:
#   docker compose -f docker-compose.yml -f docker-compose.gpu-amd.yml up -d
#   docker compose -f docker-compose.yml -f docker-compose.gpu-amd.yml stop
services:
  twitch-tts:
    restart: "no"
    build:
      args:
        TORCH_INDEX: https://download.pytorch.org/whl/rocm7.2
    image: k3113rkind-twitch-tts:rocm
    devices:
      - /dev/kfd
      - /dev/dri
    security_opt:
      - seccomp=unconfined
    environment:
      - QWEN_DEVICE=auto
      # Rechengenauigkeit: float32 (Standard, wie CPU), bfloat16 oder float16
      - QWEN_GPU_DTYPE=${QWEN_GPU_DTYPE:-float32}
      # Nach dem Start Stimme laden und mit Probesätzen aufwärmen (0 = aus)
      - QWEN_WARMUP=${QWEN_WARMUP:-1}
      # MIOpen ist standardmäßig aus (siehe app/tts.py). Wer es mit
      # QWEN_MIOPEN=1 testet: schnelle Suche statt Ausprobieren aller Wege,
      # Ergebnisse überleben Neustarts.
      - QWEN_MIOPEN=${QWEN_MIOPEN:-0}
      - MIOPEN_FIND_MODE=FAST
      - MIOPEN_USER_DB_PATH=/miopen-cache
      - MIOPEN_CUSTOM_CACHE_DIR=/miopen-cache
      # Experiment torch.compile: QWEN_COMPILE=1 (oder overhead/max) in .env,
      # 0 = aus. Kompiliertes bleibt im Cache, spätere Starts gehen schneller.
      - QWEN_COMPILE=${QWEN_COMPILE:-0}
      - TORCHINDUCTOR_CACHE_DIR=/compile-cache/inductor
      - TRITON_CACHE_DIR=/compile-cache/triton
    volumes:
      - ./models/miopen-cache:/miopen-cache
      - ./models/compile-cache:/compile-cache
