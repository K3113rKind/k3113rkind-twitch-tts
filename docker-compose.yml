services:
  twitch-tts:
    build: .
    image: k3113rkind-twitch-tts:latest
    container_name: k3113rkind-twitch-tts
    restart: unless-stopped
    ports:
      - "8380:8000"
    volumes:
      # Stimmen – werden von install.sh befüllt
      - ./models:/models:ro
      # Einstellungen – überleben Updates und Neustarts
      - ./config:/config
      # Qwen3-TTS (Test): Hugging-Face-Cache mit den Modellen, z. B. der vom
      # Benchmark (QWEN_HF_DIR=/root/qwen-test/hf in .env). Beschreibbar, weil
      # "Eigene Stimme erstellen" dort Whisper/Demucs/Base-Modelle ablegt.
      - ${QWEN_HF_DIR:-./models/qwen-hf}:/hf
      # Eigene Stimmen (Test): Referenzen NAME.wav + NAME.txt, befüllt von der
      # Weboberfläche oder tools/stimme-klonen.sh (QWEN_REF_DIR in .env)
      - ${QWEN_REF_DIR:-./models/qwen-ref}:/ref
    environment:
      - TZ=Europe/Berlin
      - HF_HOME=/hf
      # Qwen-Leistung (siehe app/tts.py): Torch-Threads, 0 = alle sichtbaren Kerne
      - QWEN_THREADS=${QWEN_THREADS:-0}
      # Füllzeichen hinter dem Satzende gegen verschluckte letzte Laute (1 = an)
      - QWEN_END_FIX=${QWEN_END_FIX:-0}
      # Eigene Stimmen schneller, aber ungenauer (nur Stimm-Fingerabdruck, 1 = an)
      - QWEN_CLONE_FAST=${QWEN_CLONE_FAST:-0}
