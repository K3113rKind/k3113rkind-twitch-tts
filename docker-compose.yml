services:
  twitch-tts:
    build: .
    image: k3113rkind-twitch-tts:latest
    container_name: k3113rkind-twitch-tts
    restart: unless-stopped
    ports:
      - "8380:8000"
    volumes:
      # Stimmen – werden von install.sh befüllt
      - ./models:/models:ro
      # Einstellungen – überleben Updates und Neustarts
      - ./config:/config
      # Qwen3-TTS (Test): Hugging-Face-Cache mit den Modellen, z. B. der vom
      # Benchmark (QWEN_HF_DIR=/root/qwen-test/hf in .env). Ohne Eintrag
      # bleibt der Ordner leer und die Qwen-Stimmen erscheinen nicht.
      - ${QWEN_HF_DIR:-./models/qwen-hf}:/hf:ro
    environment:
      - TZ=Europe/Berlin
      - HF_HOME=/hf
      # Qwen-Leistung (siehe app/tts.py): Torch-Threads, 0 = alle sichtbaren
      # Kerne. int8 wird in der GUI geschaltet.
      - QWEN_THREADS=${QWEN_THREADS:-0}
