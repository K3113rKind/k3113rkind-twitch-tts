<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Overlay</title>
<style>
  /* Transparenter Hintergrund – OBS blendet ihn aus. */
  html, body {
    margin: 0;
    background: transparent;
    font: 600 28px/1.35 "Segoe UI", system-ui, sans-serif;
    color: #fff;
    overflow: hidden;
  }
  #box {
    display: none;
    max-width: 90vw;
    margin: 24px;
    padding: 14px 20px;
    border-radius: 12px;
    background: rgba(18, 20, 27, 0.82);
    /* Kontur, damit der Text auf jedem Videohintergrund lesbar bleibt */
    text-shadow: 0 2px 6px rgba(0, 0, 0, 0.9);
    overflow-wrap: anywhere;
  }
  #box.visible { display: block; }
  #user { color: #b58cff; margin-right: .4em; }
  /* ?text=0 blendet die Textanzeige aus – dann nur Ton. */
  body.no-text #box { display: none !important; }
  #hint {
    position: fixed; left: 0; right: 0; bottom: 0;
    padding: 10px; text-align: center;
    font-size: 16px; background: rgba(180, 60, 60, .9);
  }
  #hint.hidden { display: none; }
</style>
</head>
<body>
  <div id="box"><span id="user"></span><span id="text"></span></div>
  <div id="hint" class="hidden">Kein Ton? In OBS Rechtsklick auf die Quelle → Interagieren → einmal ins Bild klicken.</div>
<script>
"use strict";
const params = new URLSearchParams(location.search);
if (params.get("text") === "0") document.body.classList.add("no-text");
const HIDE_AFTER_MS = 4000;

const box = document.getElementById("box");
const userEl = document.getElementById("user");
const textEl = document.getElementById("text");
const hint = document.getElementById("hint");

// Ton kommt als durchgehender MP3-Stream vom Server (/stream), inklusive
// Hintergrundton und Lautsprecher-Weckimpuls – siehe app/stream.py.
let hideTimer = null, pingTimer = null, restartTimer = null;
const player = new Audio();
player.preload = "none";

function startStream() {
  clearTimeout(restartTimer);
  player.src = "/stream?t=" + Date.now();
  const p = player.play();
  // OBS erlaubt Autoplay in Browser-Quellen normalerweise. Falls doch
  // blockiert: Hinweis zeigen; ein Klick über "Interagieren" startet den Ton.
  if (p) p.then(() => hint.classList.add("hidden"))
          .catch(() => hint.classList.remove("hidden"));
}
function scheduleRestart() {
  clearTimeout(restartTimer);
  restartTimer = setTimeout(startStream, 2000);
}
player.addEventListener("error", scheduleRestart);
player.addEventListener("ended", scheduleRestart);
player.addEventListener("stalled", scheduleRestart);
player.addEventListener("playing", () => hint.classList.add("hidden"));
document.addEventListener("click", () => { if (player.paused) startStream(); });
startStream();

function show(username, text) {
  userEl.textContent = username + ":";
  textEl.textContent = text;
  box.classList.add("visible");
  clearTimeout(hideTimer);
}
function hide() {
  hideTimer = setTimeout(() => box.classList.remove("visible"), HIDE_AFTER_MS);
}

let ws = null, retry = 1000;
function connect() {
  const proto = location.protocol === "https:" ? "wss" : "ws";
  ws = new WebSocket(`${proto}://${location.host}/ws`);
  ws.onopen = () => {
    retry = 1000;
    clearInterval(pingTimer);
    pingTimer = setInterval(() => {
      if (ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type: "ping" }));
    }, 25000);
  };
  ws.onclose = () => { clearInterval(pingTimer); setTimeout(connect, retry); retry = Math.min(retry * 2, 15000); };
  ws.onmessage = (ev) => {
    const msg = JSON.parse(ev.data);
    if (msg.type === "speak") show(msg.username, msg.text);
    else if (msg.type === "done") hide();
    else if (msg.type === "stop_audio") box.classList.remove("visible");
  };
}
connect();
</script>
</body>
</html>
